# ============================================================
# Docker Compose для Date Invitation
#
# Сервисы:
# - db: PostgreSQL
# - backend: NestJS API
# - frontend: Vue 3 SPA (Nginx)
# ============================================================

services:

  # ============================================================
  # База данных PostgreSQL
  # ============================================================
  db:
    image: postgres:16-alpine
    container_name: date-invitation-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-date_invitation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-date_invitation}
      POSTGRES_DB: ${POSTGRES_DB:-date_invitation}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-date_invitation}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Backend (NestJS)
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: date-invitation-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-date_invitation}:${POSTGRES_PASSWORD:-date_invitation}@db:5432/${POSTGRES_DB:-date_invitation}?schema=public
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy

  # ============================================================
  # Frontend (Vue 3 + Nginx)
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: date-invitation-frontend
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      - backend

volumes:
  postgres_data:
